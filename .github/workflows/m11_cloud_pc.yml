name: M11 Tool - PC 16GB Datacenter (v1.11 M11 Quantum Enterprise Edition)
on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: 'Tunnel Provider (tailscale, pinggy, or ngrok)'
        required: true
        default: 'tailscale'
      tunnel_token:
        description: 'Auth Token / Key (Tailscale Key, Ngrok Token, or empty for Pinggy)'
        required: false
        default: ''
      session_hours:
        description: 'Session Duration in Hours'
        required: false
        default: '6'
      enable_persistence:
        description: 'Enable Persistent User State & Cloud File Sync'
        required: false
        default: 'true'
      pat_token:
        description: 'User GitHub PAT for 100% Guaranteed 24/7 Chaining'
        required: false
        default: ''
permissions:
  actions: write
  contents: write
  statuses: write
jobs:
  run-cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: 1. Configure High-Performance M11 Cloud Environment & Free 100GB SSD
      run: |
        Write-Host "======================================================" -ForegroundColor Cyan
        Write-Host "  M11 Tool - PC (v1.11 Quantum Enterprise Edition)" -ForegroundColor Cyan
        Write-Host "  Architect: M11 Dev - Mohamed (ma7292537@gmail.com)" -ForegroundColor Yellow
        Write-Host "  Student: Mohamed El-Sayed Abdelfattah - 2nd Secondary Al-Azhar" -ForegroundColor Green
        Write-Host "  Hardware Allocation: 16 GB Physical RAM / 4 Dedicated vCPUs" -ForegroundColor Magenta
        Write-Host "  Engine: 60 FPS DWM Unlocked + Egypt Ultra-Eco Protocol" -ForegroundColor Green
        Write-Host "  License Signature: M11-QUANTUM-ENT-2026-V111-9A3E-4D88-B27F-771C" -ForegroundColor Magenta
        Write-Host "======================================================" -ForegroundColor Cyan
        
        # UNLOCK 80-100GB+ FREE SSD SPACE (Remove bloated runner SDKs)
        Write-Host ">>> Unlocking 80-100GB+ Free SSD Space on C: drive... <<<" -ForegroundColor Green
        $cleanPaths = @(
            "C:\Android",
            "C:\hostedtoolcache\windows\Go",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk",
            "C:\hostedtoolcache\windows\PyPy",
            "C:\Program Files\dotnet\sdk\NuGetFallbackFolder"
        )
        foreach ($p in $cleanPaths) {
            if (Test-Path $p) {
                Write-Host "Releasing space from: $p"
                Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue | Out-Null
            }
        }
        $freeSpaceGB = [math]::Round((Get-PSDrive C).Free / 1GB, 2)
        Write-Host "Available Free SSD Storage on C: $freeSpaceGB GB!" -ForegroundColor Green
        
                # EXTRA 100GB STORAGE: Link secondary high-speed runner drive D: to C:\ExtraStorage_100GB
                Write-Host ">>> Configuring Secondary 100GB High-Speed SSD Storage Drive... <<<" -ForegroundColor Green
                if (Test-Path "D:\") {
                    New-Item -ItemType Directory -Path "D:\M11_ExtraData" -Force -ErrorAction SilentlyContinue | Out-Null
                    New-Item -ItemType SymbolicLink -Path "C:\ExtraStorage_100GB" -Target "D:\M11_ExtraData" -Force -ErrorAction SilentlyContinue | Out-Null
                    Write-Host "Drive D: linked successfully as C:\ExtraStorage_100GB! Over 170-200GB total space active." -ForegroundColor Green
                }
        
                # CPU ULTRA-BOOST FOR HEAVY 3D GAMES & GTA V:
                Write-Host ">>> Unlocking 100% CPU Power and Multi-Threaded Game Priority <<<" -ForegroundColor Green
                # 1. Disable Core Parking and enable Ultimate Performance power plan
                try {
                    powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
                    powercfg -setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null
                    powercfg -setactive scheme_current 2>$null
                } catch {}
        
                # 2. Set Win32PrioritySeparation to 38 (Maximum Foreground Quantum for Gaming & GTA V)
                Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" -Name "Win32PrioritySeparation" -Value 38 -Type DWord -Force -ErrorAction SilentlyContinue
        
                # 3. Direct3D 11 WARP & Mesa3D Multi-Core Rasterizer Affinity (All 4 Cores Engaged)
                [Environment]::SetEnvironmentVariable("WARP_FORCE_CPU_CORES", "4", "Machine")
                [Environment]::SetEnvironmentVariable("MESA_GL_THREAD", "true", "Machine")
                [Environment]::SetEnvironmentVariable("GALLIUM_THREAD", "4", "Machine")
                [Environment]::SetEnvironmentVariable("LIBGL_THROTTLE_REFRESH", "0", "Machine")
                Write-Host "CPU & Multi-Core Rendering Engine tuned for 60 FPS in heavy 3D titles!" -ForegroundColor Green
    - name: 2. Unlock 60 FPS RDP, Disable Firewall & Disable NLA Restrictions
      run: |
        # 1. TOTALLY DISABLE WINDOWS FIREWALL ON THE RUNNER (Eliminates ALL Port/Profile Blocks!)
        Write-Host "Disabling Windows Firewall on all profiles..." -ForegroundColor Yellow
        Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
        netsh advfirewall set allprofiles state off
        
        # 2. Enable RDP in Registry
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        
        # 3. DISABLE NLA & SET NATIVE RDP SECURITY (Zero TLS/Certificate Handshake Failure)
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0
        
        # 4. UNLOCK 60 FPS IN RDP (Default Windows RDP is capped at 30 FPS!)
        New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force -ErrorAction SilentlyContinue | Out-Null
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" -Name "DWMFrameRate" -Value 60 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "DWMFrameRate" -Value 60 -Type DWord -Force -ErrorAction SilentlyContinue
        
        # 5. Hardware Video Acceleration (RemoteFX & AVC444 H.264)
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "SelectTransportProtocol" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "fEnableRemoteFX" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "RemoteFX_AVC444" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "AVC444Mode" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "VisualQuality" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "MaxMonitors" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        
        # 6. Configure dedicated RDP user M11 Dev-Tool (Clean session, zero console lock) + update runneradmin
        $plainPass = "M11Pass#2026"
        $secPass = ConvertTo-SecureString $plainPass -AsPlainText -Force
        
        # Configure runneradmin
        try { Set-LocalUser -Name "runneradmin" -Password $secPass -ErrorAction SilentlyContinue } catch {}
        try {
            $userObj = [ADSI]"WinNT://localhost/runneradmin,user"
            $userObj.SetPassword($plainPass)
            $userObj.SetInfo()
        } catch {}
        net user runneradmin "M11Pass#2026" /active:yes
        net localgroup "Remote Desktop Users" runneradmin /add
        net localgroup "Administrators" runneradmin /add
        try {
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue
        } catch {}
        
        # Create Dedicated M11 Dev-Tool User
        try {
            New-LocalUser -Name "M11 Dev-Tool" -Password $secPass -AccountNeverExpires -ErrorAction SilentlyContinue
        } catch {}
        try {
            Set-LocalUser -Name "M11 Dev-Tool" -Password $secPass -AccountNeverExpires -ErrorAction SilentlyContinue
        } catch {}
        net user "M11 Dev-Tool" "M11Pass#2026" /add /active:yes /expires:never
        net localgroup "Remote Desktop Users" "M11 Dev-Tool" /add
        net localgroup "Administrators" "M11 Dev-Tool" /add
        try {
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member "M11 Dev-Tool" -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group "Administrators" -Member "M11 Dev-Tool" -ErrorAction SilentlyContinue
        } catch {}
        
        # 7. Start supporting RDS services & restart TermService
        Set-Service -Name "SessionEnv" -StartupType Automatic -ErrorAction SilentlyContinue
        Start-Service -Name "SessionEnv" -ErrorAction SilentlyContinue
        Set-Service -Name "UmRdpService" -StartupType Automatic -ErrorAction SilentlyContinue
        Start-Service -Name "UmRdpService" -ErrorAction SilentlyContinue
        Set-Service -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue
        Restart-Service -Name "TermService" -Force -ErrorAction SilentlyContinue
        
        # 8. Extra firewall unblock for Port 3389
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "M11 RDP Allow" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
        
        # 8. Loop-check that port 3389 is actively listening locally
        $listening = $false
        for ($i = 0; $i -lt 15; $i++) {
            $tcp = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
            if ($tcp.TcpTestSucceeded) {
                Write-Host ">>> Port 3389 is actively LISTENING and verified locally! <<<" -ForegroundColor Green
                $listening = $true
                break
            }
            Start-Sleep -Seconds 2
        }
        if (-not $listening) {
            Write-Warning "TermService listening check timed out, attempting force start..."
            Start-Service -Name "TermService" -ErrorAction SilentlyContinue
        }
        
        # UNLOCK FULL ROOT / ADMINISTRATOR FREEDOM (Zero UAC Restrictions)
        Write-Host "Unlocking Full Root Administrator Freedom for M11 Dev-Tool..." -ForegroundColor Green
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "EnableLUA" -Value 0 -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "ConsentPromptBehaviorAdmin" -Value 0 -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "PromptOnSecureDesktop" -Value 0 -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer" -Name "SmartScreenEnabled" -Value "Off" -Force -ErrorAction SilentlyContinue
        [Environment]::SetEnvironmentVariable("SEE_MASK_NOZONECHECKS", "1", "Machine")
        Add-MpPreference -ExclusionPath "C:\" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "D:\" -ErrorAction SilentlyContinue
        
                # 9. 100% UNRESTRICTED BROWSER DOWNLOADS (Zero Blocking / Zero SmartScreen Prompts)
                Write-Host "Unlocking 100% browser download freedom on Chrome & Edge..." -ForegroundColor Green
                # Disable IE Enhanced Security Configuration (IE ESC)
                Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A7-37EF-4b3f-8CFC-4F3A74704073}" -Name "IsInstalled" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A8-37EF-4b3f-8CFC-4F3A74704073}" -Name "IsInstalled" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        
                # Chrome & Edge Download Freedom Policies
                $policyPaths = @("HKLM:\SOFTWARE\Policies\Google\Chrome", "HKLM:\SOFTWARE\Policies\Microsoft\Edge")
                foreach ($pp in $policyPaths) {
                    New-Item -Path $pp -Force -ErrorAction SilentlyContinue | Out-Null
                    Set-ItemProperty -Path $pp -Name "DownloadRestrictions" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                    Set-ItemProperty -Path $pp -Name "PromptForDownloadLocation" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                    Set-ItemProperty -Path $pp -Name "SafeBrowsingProtectionLevel" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
                }
    - name: 4A. Setup Tailscale WireGuard Tunnel (Zero Credit Card)
      if: github.event.inputs.tunnel_provider == 'tailscale'
      run: |
        Write-Host "Installing Tailscale for Windows via direct installer..." -ForegroundColor Cyan
        curl.exe -fsSL "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -o "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet /norestart" -Wait
        Start-Sleep -Seconds 6
        Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
        
        $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscalePath)) {
            $tailscalePath = (Get-Command tailscale.exe -ErrorAction SilentlyContinue).Source
        }
        if (-not $tailscalePath -or -not (Test-Path $tailscalePath)) {
            Write-Host "Fallback to Chocolatey for Tailscale installation..."
            choco install tailscale -y --no-progress
            $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        }
        
        Write-Host "Authenticating with Tailscale WireGuard Network..." -ForegroundColor Cyan
        $authKey = "${{ github.event.inputs.tunnel_token }}".Trim()
        & $tailscalePath up --authkey=$authKey --hostname=m11-tool-pc --accept-routes --reset --shields-up=false
        Start-Sleep -Seconds 6
        
        # Set Tailscale network adapter to Private
        Get-NetConnectionProfile -InterfaceAlias "Tailscale*" -ErrorAction SilentlyContinue | Set-NetConnectionProfile -NetworkCategory Private -ErrorAction SilentlyContinue
        
        $ip = ""
        for ($i = 0; $i -lt 15; $i++) {
            $ip = (& $tailscalePath ip -4 2>$null).Trim()
            if ($ip -match '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') { break }
            Start-Sleep -Seconds 3
        }
        
        if (-not $ip) {
            Write-Error "Failed to obtain Tailscale IPv4 address. Check if your Auth Key is valid."
            exit 1
        }
        
        Write-Host "======================================================" -ForegroundColor Green
        Write-Host ">>>M11_ENDPOINT_START<<<tcp://$($ip):3389>>>M11_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "M11_PROVIDER: TAILSCALE (60 FPS WireGuard P2P)" -ForegroundColor Cyan
        Write-Host "M11_IP: $ip" -ForegroundColor Yellow
        Write-Host "M11_USER: M11 Dev-Tool" -ForegroundColor Yellow
        Write-Host "M11_PASS: M11Pass#2026" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Green
        
        $info = @{
          endpoint = "tcp://$($ip):3389"
          provider = "tailscale"
          host = $ip
          port = "3389"
          username = "M11 Dev-Tool"
          password = "M11Pass#2026"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        $info | Out-File -FilePath "m11_connect.json" -Encoding utf8
    - name: 4B. Setup Pinggy Direct Public Tunnel (Zero Client Install)
      if: github.event.inputs.tunnel_provider == 'pinggy'
      run: |
        Write-Host "Starting Pinggy Instant Public TCP Tunnel..." -ForegroundColor Cyan
        $pToken = "${{ github.event.inputs.tunnel_token }}".Trim()
        $sshTarget = if ($pToken) { "$pToken+tcp@a.pinggy.io" } else { "tcp@a.pinggy.io" }
        Write-Host "Connecting to Pinggy via target: $sshTarget" -ForegroundColor Yellow
        Start-Process -FilePath "ssh" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -R0:localhost:3389 $sshTarget" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -NoNewWindow
        Start-Sleep -Seconds 8
        
        $publicUrl = $null
        $maxRetries = 15
        $retry = 0
        while ($retry -lt $maxRetries -and -not $publicUrl) {
            if (Test-Path "pinggy.log") {
                $rawContent = Get-Content "pinggy.log" -Raw
                # Clean VT100 / ANSI escape sequences from terminal log
                $cleanContent = $rawContent -replace '\x1b\[[0-9;]*[a-zA-Z]|\x1b\([a-zA-Z]', ''
                $lines = $cleanContent -split "`r?`n"
                foreach ($line in $lines) {
                    if ($line -match "tcp://([^:\s]+):([0-9]+)") {
                        $publicUrl = $matches[0].Trim()
                        $pHost = $matches[1].Trim()
                        $pPort = $matches[2].Trim()
                        break
                    }
                }
            }
            if (-not $publicUrl) { Start-Sleep -Seconds 2 }
            $retry++
        }
        
        if (-not $publicUrl) {
            Write-Error "Failed to extract Pinggy tunnel. Check logs:"
            if (Test-Path "pinggy.log") { Get-Content "pinggy.log" }
            if (Test-Path "pinggy_err.log") { Get-Content "pinggy_err.log" }
            exit 1
        }
        
        Write-Host "======================================================" -ForegroundColor Green
        Write-Host ">>>M11_ENDPOINT_START<<<$publicUrl>>>M11_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "M11_PROVIDER: PINGGY (Direct Public Tunnel - No Client Needed)" -ForegroundColor Cyan
        Write-Host "M11_HOST: $pHost" -ForegroundColor Yellow
        Write-Host "M11_PORT: $pPort" -ForegroundColor Yellow
        Write-Host "M11_USER: M11 Dev-Tool" -ForegroundColor Yellow
        Write-Host "M11_PASS: M11Pass#2026" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Green
        
        $info = @{
          endpoint = $publicUrl
          provider = "pinggy"
          host = $pHost
          port = $pPort
          username = "M11 Dev-Tool"
          password = "M11Pass#2026"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        $info | Out-File -FilePath "m11_connect.json" -Encoding utf8
    - name: 4C. Setup Ngrok Tunnel (Requires Credit Card on Ngrok)
      if: github.event.inputs.tunnel_provider == 'ngrok'
      run: |
        Write-Host "Downloading Ngrok v3 Engine..." -ForegroundColor Cyan
        curl.exe -fsSL -o "ngrok.zip" "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force
        
        $cleanToken = "${{ github.event.inputs.tunnel_token }}".Trim()
        .\ngrok.exe config add-authtoken $cleanToken
        
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log" -NoNewWindow
        Start-Sleep -Seconds 8
        
        $maxRetries = 10
        $retry = 0
        $publicUrl = $null
        while ($retry -lt $maxRetries -and -not $publicUrl) {
            try {
                $tunnels = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 3).tunnels
                if ($tunnels -and $tunnels.Count -gt 0) {
                    $publicUrl = $tunnels[0].public_url
                }
            } catch {
                Start-Sleep -Seconds 3
            }
            $retry++
        }
        
        if (-not $publicUrl) {
            Write-Error "Failed to extract Ngrok endpoint. Check logs below:"
            if (Test-Path "ngrok.log") { Get-Content "ngrok.log" }
            if (Test-Path "ngrok_err.log") { Get-Content "ngrok_err.log" }
            exit 1
        }
        
        Write-Host "======================================================" -ForegroundColor Cyan
        Write-Host ">>>M11_ENDPOINT_START<<<$publicUrl>>>M11_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "M11_USER: M11 Dev-Tool" -ForegroundColor Yellow
        Write-Host "M11_PASS: M11Pass#2026" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Cyan
        
        $clean = $publicUrl -replace "tcp://",""
        $parts = $clean -split ":"
        $info = @{
          endpoint = $publicUrl
          provider = "ngrok"
          host = $parts[0]
          port = $parts[1]
          username = "M11 Dev-Tool"
          password = "M11Pass#2026"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        $info | Out-File -FilePath "m11_connect.json" -Encoding utf8
    - name: 5. Upload Connection Artifact for M11 Client App
      uses: actions/upload-artifact@v4
      with:
        name: m11-endpoint
        path: m11_connect.json
        retention-days: 1
    - name: 3. Restore User Persistent State & Desktop Files
      if: github.event.inputs.enable_persistence == 'true'
      run: |
        Write-Host "Checking for existing cloud backup (Persistent State)..." -ForegroundColor Cyan
        try {
          $token = "${{ github.event.inputs.pat_token }}"
          if (-not $token) { $token = "${{ secrets.GITHUB_TOKEN }}" }
          $repo = "${{ github.repository }}"
          $url = "https://api.github.com/repos/$repo/contents/cloud_state.zip?ref=main"
          $headers = @{ "Authorization" = "Bearer $token"; "User-Agent" = "M11-Sync-v111" }
          $fileMeta = Invoke-RestMethod -Uri $url -Headers $headers -ErrorAction SilentlyContinue
          
          if ($fileMeta -and $fileMeta.download_url) {
            Write-Host "Found cloud state backup! Restoring user files to M11 Dev-Tool..." -ForegroundColor Green
            curl.exe -fsSL -o "cloud_state.zip" $fileMeta.download_url
            
            # Ensure target directories exist for M11 Dev-Tool
            $m11Dirs = @(
              "C:\Users\M11 Dev-Tool\Desktop",
              "C:\Users\M11 Dev-Tool\Documents",
              "C:\Users\M11 Dev-Tool\Downloads",
              "C:\Users\M11 Dev-Tool\AppData\Local\Roblox\ClientSettings"
            )
            foreach ($d in $m11Dirs) {
              if (-not (Test-Path $d)) { New-Item -ItemType Directory -Path $d -Force -ErrorAction SilentlyContinue | Out-Null }
            }
        
            # Extract and restore to M11 Dev-Tool (Active RDP User)
            $stagingRestore = "C:\M11Data\staging_restore"
            if (Test-Path $stagingRestore) { Remove-Item $stagingRestore -Recurse -Force -ErrorAction SilentlyContinue }
            Expand-Archive -Path "cloud_state.zip" -DestinationPath $stagingRestore -Force -ErrorAction SilentlyContinue
            
            if (Test-Path "$stagingRestore\Desktop") { robocopy "$stagingRestore\Desktop" "C:\Users\M11 Dev-Tool\Desktop" /E /R:1 /W:1 | Out-Null }
            if (Test-Path "$stagingRestore\Documents") { robocopy "$stagingRestore\Documents" "C:\Users\M11 Dev-Tool\Documents" /E /R:1 /W:1 | Out-Null }
            if (Test-Path "$stagingRestore\Downloads") { robocopy "$stagingRestore\Downloads" "C:\Users\M11 Dev-Tool\Downloads" /E /R:1 /W:1 | Out-Null }
            if (Test-Path "$stagingRestore\RobloxSettings") { robocopy "$stagingRestore\RobloxSettings" "C:\Users\M11 Dev-Tool\AppData\Local\Roblox\ClientSettings" /E /R:1 /W:1 | Out-Null }
            if (Test-Path "$stagingRestore\ChromeData") {
                $chromeDst = "C:\Users\M11 Dev-Tool\AppData\Local\Google\Chrome\User Data\Default"
                if (-not (Test-Path $chromeDst)) { New-Item -ItemType Directory -Path $chromeDst -Force | Out-Null }
                robocopy "$stagingRestore\ChromeData" $chromeDst /E /R:1 /W:1 | Out-Null
            }
        
            # Direct fallback extraction for legacy backups
            Expand-Archive -Path "cloud_state.zip" -DestinationPath "C:\Users\M11 Dev-Tool" -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path "cloud_state.zip" -DestinationPath "C:\Users\runneradmin" -Force -ErrorAction SilentlyContinue
        
            # Grant full ownership and permissions to M11 Dev-Tool
            icacls "C:\Users\M11 Dev-Tool" /grant "M11 Dev-Tool:(OI)(CI)F" /t /q 2>$null | Out-Null
            Write-Host "User files, desktop items, and game state restored 100%!" -ForegroundColor Green
          } else {
            Write-Host "No prior cloud backup found. Initializing fresh clean workspace." -ForegroundColor Yellow
          }
        } catch {
          Write-Host "State initialization completed."
        }
    - name: 2B. M11 Gaming & 3D App Hyper-Bypass Engine (Roblox, DirectX, Audiosrv, Anti-Cheat)
      run: |
        Write-Host ">>> Activating M11 Gaming & 3D App Hyper-Bypass Engine <<<" -ForegroundColor Green
        
        # 1. BYPASS ROBLOX / BYFRON ANTI-CHEAT: Disable Windows Server dtrace kernel debugger service
        Write-Host "1/8 Disabling kernel dtrace service (Anti-cheat trigger bypass)..." -ForegroundColor Yellow
        sc.exe config dtrace start=disabled
        Stop-Service -Name "dtrace" -ErrorAction SilentlyContinue
        
        # 2. ENABLE WINDOWS AUDIO ENGINE: Fixes game launch crashes on Windows Server
        Write-Host "2/8 Enabling Windows Audio Service (Audiosrv)..." -ForegroundColor Yellow
        Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
        Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue
        Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic -ErrorAction SilentlyContinue
        Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue
        
        # 3. ENABLE WINDOWS SERVER MEDIA FOUNDATION (Critical for Roblox, Unity 3D, and Discord)
        Write-Host "3/8 Installing Server-Media-Foundation (Resolves mfplat.dll / 3D game crashes)..." -ForegroundColor Yellow
        try {
            Install-WindowsFeature -Name Server-Media-Foundation -ErrorAction SilentlyContinue | Out-Null
            dism.exe /online /enable-feature /featurename:Server-Media-Foundation /all /norestart /quiet 2>$null | Out-Null
        } catch {}
        
        # 4. UNLOCK DIRECTX / REMOTEFX 3D ACCELERATION IN RDP
        Write-Host "4/8 Enabling Direct3D hardware & software acceleration in RDP..." -ForegroundColor Yellow
        New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force -ErrorAction SilentlyContinue | Out-Null
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "bEnumerateHWBeforeSW" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "fEnableRemoteFX" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "Enable3d" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" -Name "Enable3d" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        
        # 5. INSTALL VISUAL C++ 2015-2022 RUNTIMES (Resolves missing DLL crashes)
        Write-Host "5/8 Installing Visual C++ 2015-2022 Redistributables..." -ForegroundColor Yellow
        try {
            curl.exe -fsSL "https://aka.ms/vs/17/release/vc_redist.x64.exe" -o "$env:TEMP\vc_x64.exe"
            Start-Process -FilePath "$env:TEMP\vc_x64.exe" -ArgumentList "/install /quiet /norestart" -Wait
            curl.exe -fsSL "https://aka.ms/vs/17/release/vc_redist.x86.exe" -o "$env:TEMP\vc_x86.exe"
            Start-Process -FilePath "$env:TEMP\vc_x86.exe" -ArgumentList "/install /quiet /norestart" -Wait
        } catch {}
        
        # 6. DISABLE IE ENHANCED SECURITY CONFIGURATION (Allows modern game launchers & web auth)
        Write-Host "6/8 Disabling IE ESC for web game launchers..." -ForegroundColor Yellow
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A7-3749-11d2-995C-00C049429C55}" -Name "IsInstalled" -Value 0 -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A8-3749-11d2-995C-00C049429C55}" -Name "IsInstalled" -Value 0 -Force -ErrorAction SilentlyContinue
        
        # 7. EXPAND VIRTUAL PAGEFILE TO 16GB (32GB Total Committed Memory)
        Write-Host "7/8 Expanding SSD Virtual Memory Pagefile..." -ForegroundColor Yellow
        try {
            Set-CimInstance -Query "Select * from Win32_PageFileSetting where Name like C:%" -Property @{InitialSize = 8192; MaximumSize = 16384} -ErrorAction SilentlyContinue
        } catch {}
        
        # 8. Pre-install Google Chrome Enterprise (Direct MSI - 100% Guaranteed Success)
        Write-Host "8/8 Pre-installing Google Chrome Enterprise standalone MSI..." -ForegroundColor Yellow
        try {
            curl.exe -fsSL "https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi" -o "$env:TEMP\chrome_enterprise.msi"
            Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$env:TEMP\chrome_enterprise.msi`" /qn /norestart" -Wait
            Write-Host "Google Chrome Enterprise installed 100% successfully!" -ForegroundColor Green
        } catch {
