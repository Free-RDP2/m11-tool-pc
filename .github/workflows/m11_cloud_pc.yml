                } catch {}
                $bData = @{ message = "M11 Pre-Chaining Emergency Flush"; content = $b64 }
                if ($sha) { $bData["sha"] = $sha }
                Invoke-RestMethod -Uri $checkUrl -Headers $headers -Method Put -Body ($bData | ConvertTo-Json) -ErrorAction SilentlyContinue | Out-Null
                Write-Host "Final state flush completed before handover!" -ForegroundColor Green
              }
            } catch {}
        
            Write-Host "Dispatching next Cloud PC runner to keep session alive 24/7..." -ForegroundColor Yellow
            try {
              $dispatchUrl = "https://api.github.com/repos/$repo/actions/workflows/m11_cloud_pc.yml/dispatches"
              $dispatchBody = @{
                ref = "main"
                inputs = @{
                  tunnel_provider = "${{ github.event.inputs.tunnel_provider }}"
                  tunnel_token = "${{ github.event.inputs.tunnel_token }}"
                  enable_persistence = "true"
                  pat_token = $token
                }
              } | ConvertTo-Json
              $headers = @{ "Authorization" = "Bearer $token"; "User-Agent" = "M11-Chaining-v011" }
              Invoke-RestMethod -Uri $dispatchUrl -Headers $headers -Method Post -Body $dispatchBody -ErrorAction SilentlyContinue | Out-Null
              Write-Host "Next runner dispatched! Seamless 24/7 handover initiated." -ForegroundColor Green
            } catch {
              Write-Host "Chaining notice: $_"
            }
          }
        
          if ($elapsed % 600 -eq 0) {
            Write-Host "Cloud PC Heartbeat: $elapsed / $maxSeconds seconds active (60 FPS Stream Healthy)."
          }
        }
