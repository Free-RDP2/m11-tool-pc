        netsh int ip reset >nul 2>&1

        echo [4/4] Testing TCP latency to international datacenters (ICMP is blocked on cloud hosts)...
        powershell -NoProfile -Command "`$t=@('1.1.1.1','8.8.8.8'); foreach(`$h in `$t){ `$ms=@(); foreach(`$i in 1..3){ `$sw=[Diagnostics.Stopwatch]::StartNew(); try{ `$c=New-Object Net.Sockets.TcpClient; `$c.Connect(`$h,443); `$c.Close(); `$sw.Stop(); `$ms+=[int]`$sw.ElapsedMilliseconds } catch { `$sw.Stop(); `$ms+=-1 } }; Write-Host ('  {0,-9} TCP:443 -> ' -f `$h) -NoNewline; Write-Host (`$ms -join ' / ') -ForegroundColor Green }"
        echo.
        echo ==============================================================================
        echo [SUCCESS] Network and TCP stack optimized for ultra-low latency ^& 1000 Mbps!
        echo ==============================================================================
        pause
        "@

        $audioBat = @"
