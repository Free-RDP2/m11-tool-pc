        '@

        # 1. Roblox Deep Fix & 60 FPS Anti-Lag Engine
        $robloxDeepBat = @'
        @echo off
        setlocal EnableDelayedExpansion
        chcp 65001 >nul 2>&1
        title M11 ROBLOX PLAYER + STUDIO DEPLOYER (v3)
        color 0a
        
        rem ============================================================================
        rem  M11 TOOL - PC : ENGINE 01 v3 - Roblox Player + Studio Deployer
        rem  Developer: Mohamed El-Sayed Abdelfattah - M11 Dev
        rem  What it does:
        rem    1. Installs Roblox Player silently (winget -> direct -> versioned CDN)
        rem    2. Installs Roblox Studio silently (the client that DOES run on VMs)
        rem    3. Applies 60 FPS Direct3D11 fast flags for every installed version
        rem    4. Registers the roblox-player:// protocol so Play buttons work
        rem    5. Applies the known anti-VM-detection mitigations (best effort)
        rem    6. LAUNCH-TESTS both apps and writes an honest report to the Desktop
        rem  Honest note: Roblox Player refuses to start on virtual machines by design
        rem  (Hyperion anti-cheat). The mitigations below help where the VM is only
        rem  detected through guest features - on a real PC this engine gives a
        rem  perfect 60 FPS setup. Studio works on VMs and is installed as well.
        rem ============================================================================
        
        set "LOGDIR=C:\M11Data"
        if not exist "%LOGDIR%" set "LOGDIR=%TEMP%"
        set "RPT=%LOGDIR%\m11_roblox_report.txt"
        set "MODE=%~1"
        
        echo ==============================================================================
        echo    M11 ROBLOX DEPLOYER v3 - Player + Studio, silent and verified
        echo ==============================================================================
        echo. > "%RPT%"
        echo ===== M11 ROBLOX v3 %DATE% %TIME% ===== >> "%RPT%"
        echo user=%USERNAME% profile=%USERPROFILE% >> "%RPT%"
        
        echo [1/9] Stopping lingering Roblox processes...
        taskkill /f /im RobloxPlayerBeta.exe >nul 2>&1
        taskkill /f /im RobloxStudioBeta.exe >nul 2>&1
        taskkill /f /im RobloxPlayerInstaller.exe >nul 2>&1
        
        echo [2/9] Cleaning corrupt Roblox state (installed versions are kept)...
        reg delete "HKCU\Software\ROBLOX Corporation\Environments" /f >nul 2>&1
        rmdir /s /q "%TEMP%\Roblox" >nul 2>&1
        del /f /q "%LOCALAPPDATA%\Roblox\logs\*.log" >nul 2>&1
        
        echo [3/9] Ensuring WebView2 + VC++ 2015-2022 (x86 + x64)...
        if not exist "%PROGRAMFILES(X86)%\Microsoft\EdgeWebView\Application" if not exist "%PROGRAMFILES%\Microsoft\EdgeWebView\Application" (
            curl.exe -fsSL --max-time 300 -o "%TEMP%\WebView2Setup.exe" "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
            if exist "%TEMP%\WebView2Setup.exe" start "" /wait "%TEMP%\WebView2Setup.exe" /silent /install
        )
        curl.exe -fsSL --max-time 300 -o "%TEMP%\vc_x64.exe" "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        curl.exe -fsSL --max-time 300 -o "%TEMP%\vc_x86.exe" "https://aka.ms/vs/17/release/vc_redist.x86.exe"
        if exist "%TEMP%\vc_x64.exe" start "" /wait "%TEMP%\vc_x64.exe" /quiet /norestart
        if exist "%TEMP%\vc_x86.exe" start "" /wait "%TEMP%\vc_x86.exe" /quiet /norestart
        
        echo [4/9] Installing Roblox Player silently...
        call :PLAYER_INSTALLED
        if "!PINST!"=="0" (
            where winget >nul 2>&1
            if !errorlevel! EQU 0 winget install -e --id Roblox.Roblox --silent --accept-package-agreements --accept-source-agreements --disable-interactivity >nul 2>&1
            call :PLAYER_INSTALLED
        )
        if "!PINST!"=="0" (
            curl.exe -fsSL --max-time 300 -o "%TEMP%\RobloxPlayerInstaller.exe" "https://setup.rbxcdn.com/RobloxPlayerInstaller.exe"
            if exist "%TEMP%\RobloxPlayerInstaller.exe" start "" /wait "%TEMP%\RobloxPlayerInstaller.exe" -install -silent
            call :PLAYER_INSTALLED
        )
        echo       player installed = !PINST! >> "%RPT%"
        if "!PINST!"=="1" (echo       Player: installed.) else (echo       Player: NOT installed - check your connection and run again.)
        
        echo [5/9] Installing Roblox Studio silently (works on virtual machines)...
        call :STUDIO_INSTALLED
        if "!SINST!"=="0" (
            curl.exe -fsSL --max-time 300 -o "%TEMP%\RobloxStudioInstaller.exe" "https://setup.rbxcdn.com/RobloxStudioInstaller.exe"
            if exist "%TEMP%\RobloxStudioInstaller.exe" (
                start "" /wait "%TEMP%\RobloxStudioInstaller.exe" -silent
                timeout /t 20 /nobreak >nul
            )
            call :STUDIO_INSTALLED
            if "!SINST!"=="0" (
                where winget >nul 2>&1
                if !errorlevel! EQU 0 winget install -e --id Roblox.RobloxStudio --silent --accept-package-agreements --accept-source-agreements --disable-interactivity >nul 2>&1
                call :STUDIO_INSTALLED
            )
        )
        echo       studio installed = !SINST! >> "%RPT%"
        if "!SINST!"=="1" (echo       Studio: installed.) else (echo       Studio: not installed yet - run this engine again later.)
        
        echo [6/9] Applying 60 FPS Direct3D11 fast flags to every installed version...
        set "SETTINGS_JSON={"DFIntTaskSchedulerTargetFps":60,"FFlagTaskSchedulerLimitTargetFpsTo240":"False","FFlagDebugGraphicsPreferD3D11":"True","FFlagDebugGraphicsDisableDirect3D11":"False","DFFlagDisableDPIScale":"True","FFlagGraphicsDirect3D11ForceD3D11":"True","FFlagDebugGraphicsPreferD3D11FL10":"True","DFIntCanHideGuiGroupId":32380007,"FIntRenderShadowIntensity":0,"DFIntDebugFRMQualityLevelOverride":1}"
        mkdir "%LOCALAPPDATA%\Roblox\ClientSettings" >nul 2>&1
        echo !SETTINGS_JSON! > "%LOCALAPPDATA%\Roblox\ClientSettings\ClientAppSettings.json"
        for %%R in ("C:\Program Files\Roblox\Versions" "%LOCALAPPDATA%\Roblox\Versions" "%LOCALAPPDATA%\Roblox\Studio") do (
            if exist %%R (
                for /d %%D in ("%%~R\*") do (
                    mkdir "%%D\ClientSettings" >nul 2>&1
                    echo !SETTINGS_JSON! > "%%D\ClientSettings\ClientAppSettings.json"
                    if exist "%%D\RobloxPlayerBeta.exe" set "PLAYER=%%D\RobloxPlayerBeta.exe"
                    if exist "%%D\RobloxStudioBeta.exe" set "STUDIO=%%D\RobloxStudioBeta.exe"
                )
            )
        )
        echo       fast flags written (60 FPS, D3D11, 60 z-buffer shadow off) >> "%RPT%"
        powershell -NoProfile -Command "try { $p=Join-Path $env:LOCALAPPDATA 'Roblox\ClientSettings\ClientAppSettings.json'; $o=Get-Content $p -Raw | ConvertFrom-Json; $n=(Get-ChildItem 'C:\Program Files\Roblox\Versions' -Directory -ErrorAction SilentlyContinue | Measure-Object).Count; Write-Output ('FLAGS JSON: VALID (fps=' + $o.DFIntTaskSchedulerTargetFps + ', d3d11=' + $o.FFlagDebugGraphicsPreferD3D11 + ', version folders=' + $n + ')') } catch { Write-Output ('FLAGS JSON: INVALID - ' + $_.Exception.Message) }" >> "%RPT%" 2>&1
        
        echo [7/9] Registering the roblox-player and roblox-studio protocols...
        if defined PLAYER (
            reg add "HKCU\Software\Classes\roblox-player\shell\open\command" /ve /d "\"!PLAYER!\" \"%%1\"" /f >nul 2>&1
            reg add "HKCU\Software\Classes\roblox\shell\open\command" /ve /d "\"!PLAYER!\" \"%%1\"" /f >nul 2>&1
            reg add "HKCU\Software\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers" /v "!PLAYER!" /t REG_SZ /d "~ HIGHDPIAWARE" /f >nul 2>&1
            echo       protocol -^> !PLAYER! >> "%RPT%"
        )
        if defined STUDIO (
            reg add "HKCU\Software\Classes\roblox-studio\shell\open\command" /ve /d "\"!STUDIO!\" \"%%1\"" /f >nul 2>&1
            reg add "HKCU\Software\Classes\roblox-studio-auth\shell\open\command" /ve /d "\"!STUDIO!\" \"%%1\"" /f >nul 2>&1
        )
        netsh advfirewall firewall add rule name="M11 Roblox Player" dir=in action=allow program="!PLAYER!" >nul 2>&1
        netsh advfirewall firewall add rule name="M11 Roblox Studio" dir=in action=allow program="!STUDIO!" >nul 2>&1
        reg add "HKCU\Software\Microsoft\DirectX\UserGpuPreferences" /v "!PLAYER!" /t REG_SZ /d "GpuPreference=2;" /f >nul 2>&1
        
        echo [8/9] Anti-VM-detection mitigations (best effort, needs one reboot to bite)...
        powershell -NoProfile -Command "Disable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All -NoRestart -ErrorAction SilentlyContinue" >nul 2>&1
        powershell -NoProfile -Command "Disable-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform -NoRestart -ErrorAction SilentlyContinue" >nul 2>&1
        powershell -NoProfile -Command "Disable-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform -NoRestart -ErrorAction SilentlyContinue" >nul 2>&1
        reg add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard" /v EnableVirtualizationBasedSecurity /t REG_DWORD /d 0 /f >nul 2>&1
        reg add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity" /v Enabled /t REG_DWORD /d 0 /f >nul 2>&1
        reg add "HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\CredentialGuard" /v Enabled /t REG_DWORD /d 0 /f >nul 2>&1
        bcdedit /set hypervisorlaunchtype off >nul 2>&1
        echo       mitigations applied (memory integrity off, Hyper-V guest off, hypervisorlaunchtype=off) >> "%RPT%"
        echo       NOTE: a reboot is required for these to take effect. >> "%RPT%"
        
        echo [9/9] Launch test - Player (20 s) then Studio (30 s)...
        set "PVM=unknown"
        if defined PLAYER (
            echo       testing: !PLAYER! >> "%RPT%"
            start "" "!PLAYER!"
            timeout /t 20 /nobreak >nul
            tasklist /fi "imagename eq RobloxPlayerBeta.exe" | find /i "RobloxPlayerBeta.exe" >nul 2>&1
            if !errorlevel! EQU 0 (
                echo       [PASS] RobloxPlayerBeta.exe is RUNNING >> "%RPT%"
