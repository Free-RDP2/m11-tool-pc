    - name: 2D. Deploy Data Persistence Daemon & Security Rules
      run: |
        Write-Host ">>> Deploying M11 v1.12 Persistence Daemon <<<" -ForegroundColor Green
        Add-MpPreference -ExclusionPath "C:\M11Data" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess "RobloxPlayerBeta.exe" -ErrorAction SilentlyContinue

        $daemonB64 = ''
        $daemon = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($daemonB64))
        $daemon = $daemon.Replace('REPLACE_PAT', "${{ github.event.inputs.pat_token }}")
        $daemon = $daemon.Replace('REPLACE_GHT', "${{ secrets.GITHUB_TOKEN }}")
        $daemon = $daemon.Replace('REPLACE_REPO', "${{ github.repository }}")
        [System.IO.File]::WriteAllText("C:\M11Data\m11_persistent_daemon.ps1", $daemon, (New-Object System.Text.UTF8Encoding($false)))
        Start-Process -FilePath "powershell.exe" -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File C:\M11Data\m11_persistent_daemon.ps1 -Daemon" -WindowStyle Hidden
        Start-Sleep -Seconds 3
        if (Test-Path "C:\M11Data\m11_sync.log") { Get-Content "C:\M11Data\m11_sync.log" -Tail 5 }
        Write-Host "Persistence daemon deployed and running." -ForegroundColor Green

    - name: 4A. Setup Tailscale WireGuard Tunnel (Zero Credit Card)
      if: github.event.inputs.tunnel_provider == 'tailscale'
      run: |
        Write-Host "Installing Tailscale for Windows via direct installer..." -ForegroundColor Cyan
        curl.exe -fsSL "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -o "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet /norestart" -Wait
        Start-Sleep -Seconds 6
        Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue

        $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscalePath)) {
            $tailscalePath = (Get-Command tailscale.exe -ErrorAction SilentlyContinue).Source
        }
        if (-not $tailscalePath -or -not (Test-Path $tailscalePath)) {
            Write-Host "Fallback to Chocolatey for Tailscale installation..."
            choco install tailscale -y --no-progress
            $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        }

        Write-Host "Authenticating with Tailscale WireGuard Network..." -ForegroundColor Cyan
        $authKey = "${{ github.event.inputs.tunnel_token }}".Trim()
        $nodeName = "m11-tool-pc-$('${{ github.run_id }}')"
        if ($nodeName -notmatch '^[a-z0-9-]+$') { $nodeName = "m11-tool-pc" }
        Write-Host "Joining Tailscale as $nodeName (unique per session = no node collisions)..." -ForegroundColor Cyan
        & $tailscalePath up --authkey=$authKey --hostname=$nodeName --accept-routes --reset --shields-up=false --unattended
        Start-Sleep -Seconds 6

        # Set Tailscale network adapter to Private
        Get-NetConnectionProfile -InterfaceAlias "Tailscale*" -ErrorAction SilentlyContinue | Set-NetConnectionProfile -NetworkCategory Private -ErrorAction SilentlyContinue

        # Bind TermService to newly created Tailscale adapter and restart TermService
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "LanAdapter" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fEnableWinStation" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Restart-Service -Name "TermService" -Force -ErrorAction SilentlyContinue

        # Ensure Windows Firewall does not filter Tailscale adapter
        Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False -ErrorAction SilentlyContinue
        netsh advfirewall set allprofiles state off
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        New-NetFirewallRule -DisplayName "Tailscale Inbound All" -InterfaceAlias "Tailscale*" -Direction Inbound -Action Allow -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "Tailscale RDP 3389" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue

        $ip = ""
        for ($i = 0; $i -lt 15; $i++) {
            $ip = (& $tailscalePath ip -4 2>$null).Trim()
            if ($ip -match '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') { break }
            Start-Sleep -Seconds 3
        }

        if (-not $ip) {
            Write-Error "Failed to obtain Tailscale IPv4 address. Check if your Auth Key is valid."
            exit 1
        }

        # Verify local reachability of 3389 on Tailscale IP
        $testLocal = Test-NetConnection -ComputerName $ip -Port 3389 -WarningAction SilentlyContinue
        Write-Host "Local verification on Tailscale IP ($ip:3389): $($testLocal.TcpTestSucceeded)" -ForegroundColor Green

        Write-Host "======================================================" -ForegroundColor Green
        Write-Host ">>>M11_ENDPOINT_START<<<tcp://$($ip):3389>>>M11_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "M11_PROVIDER: TAILSCALE (60 FPS WireGuard P2P)" -ForegroundColor Cyan
        Write-Host "M11_IP: $ip" -ForegroundColor Yellow
        Write-Host "M11_USER: M11 Dev-Tool" -ForegroundColor Yellow
        Write-Host "M11_PASS: M11Pass#2026" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Green

        $info = @{
          endpoint = "tcp://$($ip):3389"
          provider = "tailscale"
          host = $ip
          port = "3389"
          username = "M11 Dev-Tool"
          password = "M11Pass#2026"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        [System.IO.File]::WriteAllText("m11_connect.json", $info, (New-Object System.Text.UTF8Encoding($false)))
    - name: 4B. Setup Pinggy Direct Public Tunnel (Zero Client Install)
      if: github.event.inputs.tunnel_provider == 'pinggy'
      run: |
        Write-Host "Starting Pinggy Instant Public TCP Tunnel..." -ForegroundColor Cyan
        $pToken = "${{ github.event.inputs.tunnel_token }}".Trim()
        $sshTarget = if ($pToken) { "$pToken+tcp@a.pinggy.io" } else { "tcp@a.pinggy.io" }
        Write-Host "Connecting to Pinggy via target: $sshTarget" -ForegroundColor Yellow
        Start-Process -FilePath "ssh" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -R0:localhost:3389 $sshTarget" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -NoNewWindow
        Start-Sleep -Seconds 8

        $publicUrl = $null
        $maxRetries = 15
        $retry = 0
        while ($retry -lt $maxRetries -and -not $publicUrl) {
            if (Test-Path "pinggy.log") {
                $rawContent = Get-Content "pinggy.log" -Raw
                # Clean VT100 / ANSI escape sequences from terminal log
                $cleanContent = $rawContent -replace '\x1b\[[0-9;]*[a-zA-Z]|\x1b\([a-zA-Z]', ''
                $lines = $cleanContent -split "`r?`n"
                foreach ($line in $lines) {
                    if ($line -match "tcp://([^:\s]+):([0-9]+)") {
                        $publicUrl = $matches[0].Trim()
                        $pHost = $matches[1].Trim()
                        $pPort = $matches[2].Trim()
                        break
                    }
                }
            }
            if (-not $publicUrl) { Start-Sleep -Seconds 2 }
            $retry++
        }

        if (-not $publicUrl) {
            Write-Error "Failed to extract Pinggy tunnel. Check logs:"
            if (Test-Path "pinggy.log") { Get-Content "pinggy.log" }
            if (Test-Path "pinggy_err.log") { Get-Content "pinggy_err.log" }
            exit 1
        }

        Write-Host "======================================================" -ForegroundColor Green
        Write-Host ">>>M11_ENDPOINT_START<<<$publicUrl>>>M11_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "M11_PROVIDER: PINGGY (Direct Public Tunnel - No Client Needed)" -ForegroundColor Cyan
        Write-Host "M11_HOST: $pHost" -ForegroundColor Yellow
        Write-Host "M11_PORT: $pPort" -ForegroundColor Yellow
        Write-Host "M11_USER: M11 Dev-Tool" -ForegroundColor Yellow
        Write-Host "M11_PASS: M11Pass#2026" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Green

        $info = @{
          endpoint = $publicUrl
          provider = "pinggy"
          host = $pHost
          port = $pPort
          username = "M11 Dev-Tool"
          password = "M11Pass#2026"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        [System.IO.File]::WriteAllText("m11_connect.json", $info, (New-Object System.Text.UTF8Encoding($false)))
    - name: 4C. Setup Ngrok Tunnel (Requires Credit Card on Ngrok)
      if: github.event.inputs.tunnel_provider == 'ngrok'
      run: |
        Write-Host "Downloading Ngrok v3 Engine..." -ForegroundColor Cyan
        curl.exe -fsSL -o "ngrok.zip" "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

        $cleanToken = "${{ github.event.inputs.tunnel_token }}".Trim()
        .\ngrok.exe config add-authtoken $cleanToken

        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log" -NoNewWindow
        Start-Sleep -Seconds 8

        $maxRetries = 10
        $retry = 0
        $publicUrl = $null
        while ($retry -lt $maxRetries -and -not $publicUrl) {
            try {
                $tunnels = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 3).tunnels
                if ($tunnels -and $tunnels.Count -gt 0) {
                    $publicUrl = $tunnels[0].public_url
                }
            } catch {
                Start-Sleep -Seconds 3
            }
            $retry++
        }

        if (-not $publicUrl) {
            Write-Error "Failed to extract Ngrok endpoint. Check logs below:"
            if (Test-Path "ngrok.log") { Get-Content "ngrok.log" }
            if (Test-Path "ngrok_err.log") { Get-Content "ngrok_err.log" }
            exit 1
        }

        Write-Host "======================================================" -ForegroundColor Cyan
        Write-Host ">>>M11_ENDPOINT_START<<<$publicUrl>>>M11_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "M11_USER: M11 Dev-Tool" -ForegroundColor Yellow
        Write-Host "M11_PASS: M11Pass#2026" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Cyan

        $clean = $publicUrl -replace "tcp://",""
        $parts = $clean -split ":"
        $info = @{
          endpoint = $publicUrl
          provider = "ngrok"
          host = $parts[0]
          port = $parts[1]
          username = "M11 Dev-Tool"
          password = "M11Pass#2026"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        [System.IO.File]::WriteAllText("m11_connect.json", $info, (New-Object System.Text.UTF8Encoding($false)))
    - name: 5. Upload Connection Artifact for M11 Client App
      uses: actions/upload-artifact@v4
      with:
        name: m11-endpoint
        path: m11_connect.json
        retention-days: 1
    - name: 6. Session Watchdog & 24/7 Chaining (with real handover)
      run: |
        Write-Host "===========================================================================" -ForegroundColor Green
        Write-Host " M11 v1.12 SESSION WATCHDOG - the cloud PC stays online while this runs" -ForegroundColor Green
        Write-Host "===========================================================================" -ForegroundColor Green

        $token = "${{ github.event.inputs.pat_token }}"
        if (-not $token) { $token = "${{ secrets.GITHUB_TOKEN }}" }
        $repo = "${{ github.repository }}"
        $headers = @{ "Authorization" = "Bearer $token"; "User-Agent" = "M11-Chaining-v112" }
        $minutes = 330          # 5h30m of runtime, chaining at 5h20m
        $chainAt = 320
        $elapsed = 0
        $chained = $false

        function Write-M11Log([string]$m) {
            $line = "$(Get-Date -Format 'HH:mm:ss') | $m"
            Add-Content -Path "C:\M11Data\m11_watchdog.log" -Value $line -Encoding UTF8
            Write-Host $line
        }

        function Sync-CloudState([string]$reason) {
            try {
                $paths = @()
                foreach ($p in @("C:\Users\M11 Dev-Tool\Desktop","C:\Users\M11 Dev-Tool\Documents","C:\Users\M11 Dev-Tool\Downloads","C:\Users\M11 Dev-Tool\AppData\Local\Roblox\ClientSettings")) {
                    if (Test-Path $p) { $paths += $p }
                }
                if ($paths.Count -eq 0) { return }
                $stg = "C:\M11Data\staging_watchdog"
                if (Test-Path $stg) { Remove-Item $stg -Recurse -Force -ErrorAction SilentlyContinue }
                New-Item -ItemType Directory -Path $stg -Force | Out-Null
                [System.IO.File]::WriteAllText("C:\M11Data\sync_now.trigger", "flush", (New-Object System.Text.UTF8Encoding($false)))
                Start-Sleep -Seconds 12
                Compress-Archive -Path $paths -DestinationPath "C:\M11Data\watchdog_state.zip" -Force -ErrorAction SilentlyContinue
                if (-not (Test-Path "C:\M11Data\watchdog_state.zip")) { return }
                $b64 = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes("C:\M11Data\watchdog_state.zip"))
                $url = "https://api.github.com/repos/$repo/contents/cloud_state.zip"
                $sha = $null
                try { $rf = Invoke-RestMethod -Uri $url -Headers $headers -ErrorAction SilentlyContinue; if ($rf.sha) { $sha = $rf.sha } } catch { }
                $body = @{ message = "M11 watchdog flush: $reason"; content = $b64 }
                if ($sha) { $body["sha"] = $sha }
                Invoke-RestMethod -Uri $url -Headers $headers -Method Put -Body ($body | ConvertTo-Json) -ErrorAction SilentlyContinue | Out-Null
                Write-M11Log "[FLUSH OK] $reason"
            } catch { Write-M11Log "[FLUSH ERROR] $($_.Exception.Message)" }
        }

        while ($elapsed -lt ($minutes * 60)) {
            Start-Sleep -Seconds 60
            $elapsed += 60
            if ($elapsed % 600 -eq 0) { Write-M11Log ("cloud PC online: " + [int]($elapsed/60) + " / " + $minutes + " minutes") }

            if ($elapsed -ge ($chainAt * 60) -and -not $chained) {
                $chained = $true
                Write-M11Log "handover window reached - flushing state first"
                Sync-CloudState "pre-handover"

                # only now cancel older runs of this workflow
                try {
                    $runs = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/runs?per_page=20" -Headers $headers
                    foreach ($r in $runs.workflow_runs) {
                        if ($r.status -in @('in_progress','queued') -and $r.id -ne ${{ github.run_id }}) {
                            Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/runs/$($r.id)/cancel" -Headers $headers -Method Post -ErrorAction SilentlyContinue | Out-Null
                            Write-M11Log ("cancelled older run " + $r.id)
                        }
                    }
                } catch { Write-M11Log "cancel notice: $($_.Exception.Message)" }

                try {
                    $dispatchBody = @{
                        ref = "main"
                        inputs = @{
                            tunnel_provider   = "${{ github.event.inputs.tunnel_provider }}"
                            tunnel_token      = "${{ github.event.inputs.tunnel_token }}"
                            enable_persistence= "true"
                            session_hours     = "6"
                            pat_token         = $token
                        }
                    } | ConvertTo-Json
                    Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/workflows/m11_cloud_pc.yml/dispatches" -Headers $headers -Method Post -Body $dispatchBody -ErrorAction SilentlyContinue | Out-Null
                    Write-M11Log "next session dispatched - handover complete"
                } catch { Write-M11Log "dispatch notice: $($_.Exception.Message)" }

                Start-Sleep -Seconds 60
                Sync-CloudState "post-handover safety flush"
                Write-M11Log "watchdog exiting so this runner is released to the chained session"
                exit 0
            }
        }
        Sync-CloudState "session end"
        exit 0

