          port = $pPort
          username = "M11 Dev-Tool"
          password = "M11Pass#2026"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        $info | Out-File -FilePath "m11_connect.json" -Encoding utf8
    - name: 4C. Setup Ngrok Tunnel (Requires Credit Card on Ngrok)
      if: github.event.inputs.tunnel_provider == 'ngrok'
      run: |
        Write-Host "Downloading Ngrok v3 Engine..." -ForegroundColor Cyan
        curl.exe -fsSL -o "ngrok.zip" "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

        $cleanToken = "${{ github.event.inputs.tunnel_token }}".Trim()
        .\ngrok.exe config add-authtoken $cleanToken

        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log" -NoNewWindow
        Start-Sleep -Seconds 8

        $maxRetries = 10
        $retry = 0
        $publicUrl = $null
        while ($retry -lt $maxRetries -and -not $publicUrl) {
            try {
                $tunnels = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 3).tunnels
                if ($tunnels -and $tunnels.Count -gt 0) {
                    $publicUrl = $tunnels[0].public_url
                }
            } catch {
                Start-Sleep -Seconds 3
            }
            $retry++
        }

        if (-not $publicUrl) {
            Write-Error "Failed to extract Ngrok endpoint. Check logs below:"
            if (Test-Path "ngrok.log") { Get-Content "ngrok.log" }
            if (Test-Path "ngrok_err.log") { Get-Content "ngrok_err.log" }
            exit 1
        }

        Write-Host "======================================================" -ForegroundColor Cyan
        Write-Host ">>>M11_ENDPOINT_START<<<$publicUrl>>>M11_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "M11_USER: M11 Dev-Tool" -ForegroundColor Yellow
        Write-Host "M11_PASS: M11Pass#2026" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Cyan

        $clean = $publicUrl -replace "tcp://",""
        $parts = $clean -split ":"
        $info = @{
          endpoint = $publicUrl
          provider = "ngrok"
          host = $parts[0]
          port = $parts[1]
          username = "M11 Dev-Tool"
          password = "M11Pass#2026"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        $info | Out-File -FilePath "m11_connect.json" -Encoding utf8
    - name: 5. Upload Connection Artifact for M11 Client App
      uses: actions/upload-artifact@v4
      with:
        name: m11-endpoint
        path: m11_connect.json
        retention-days: 1
    - name: 6. Session Watchdog & Dual-Guard 24/7 Chaining Daemon
      run: |
        Write-Host "===========================================================================" -ForegroundColor Green
        Write-Host "⚡ M11 TOOL - PC SESSION WATCHDOG ACTIVE & RUNNING 100% ⚡" -ForegroundColor Green
        Write-Host ">> IMPORTANT: This step is the LIVING HEART of your Cloud PC!" -ForegroundColor Cyan
        Write-Host ">> It keeps the Windows instance alive in Microsoft Azure for up to 6 hours." -ForegroundColor Yellow
        Write-Host ">> DO NOT wait for this step to complete with a green checkmark!" -ForegroundColor Yellow
        Write-Host ">> If this step finishes, the Cloud PC turns off. The spinning icon means ONLINE!" -ForegroundColor Green
        Write-Host ">> You can connect via Remote Desktop right NOW! <<" -ForegroundColor Green
        Write-Host "===========================================================================" -ForegroundColor Green
        Write-Host "Lead Developer: M11 Dev - Mohamed | v1.11 Enterprise Ultra"

        $token = "${{ github.event.inputs.pat_token }}"
        if (-not $token) { $token = "${{ secrets.GITHUB_TOKEN }}" }
        $repo = "${{ github.repository }}"
        $maxSeconds = 21600 # 6 hours total
        $elapsed = 0
        $backupInterval = 300 # Continuous Backup every 5 minutes
        $lastBackup = 0
        $chainTriggered = $false

        while ($elapsed -lt $maxSeconds) {
          Start-Sleep -Seconds 60
          $elapsed += 60

          # Periodic Auto-Backup to Cloud (Every 5 Minutes Continuous Sync)
          if (($elapsed - $lastBackup) -ge $backupInterval) {
            $lastBackup = $elapsed
            Write-Host "Continuous State Sync: Preserving user files to Cloud (M11 Dev-Tool + runneradmin)..." -ForegroundColor Cyan
            try {
              $candPaths = @(
                "C:\Users\M11 Dev-Tool\Desktop",
                "C:\Users\M11 Dev-Tool\Documents",
                "C:\Users\M11 Dev-Tool\Downloads",
                "C:\Users\M11 Dev-Tool\AppData\Local\Roblox\ClientSettings",
                "C:\Users\runneradmin\Desktop",
                "C:\Users\runneradmin\Documents"
              )
              $pathsToSave = @()
              foreach ($cp in $candPaths) {
                if (Test-Path $cp) { $pathsToSave += $cp }
              }

              if ($pathsToSave.Count -gt 0) {
                Compress-Archive -Path $pathsToSave -DestinationPath "cloud_state.zip" -Force -ErrorAction SilentlyContinue
                if (Test-Path "cloud_state.zip") {
                  $bytes = [System.IO.File]::ReadAllBytes("cloud_state.zip")
                  $b64 = [System.Convert]::ToBase64String($bytes)

                  $checkUrl = "https://api.github.com/repos/$repo/contents/cloud_state.zip"
                  $headers = @{ "Authorization" = "Bearer $token"; "User-Agent" = "M11-Sync-v111" }
                  $sha = $null
                  try {
                    $remoteFile = Invoke-RestMethod -Uri $checkUrl -Headers $headers -ErrorAction SilentlyContinue
                    if ($remoteFile -and $remoteFile.sha) { $sha = $remoteFile.sha }
                  } catch {}

                  $body = @{
                    message = "M11 Tool - PC Auto-Backup at $($elapsed)s [Continuous Sync]"
                    content = $b64
                  }
                  if ($sha) { $body["sha"] = $sha }

                  Invoke-RestMethod -Uri $checkUrl -Headers $headers -Method Put -Body ($body | ConvertTo-Json) -ErrorAction SilentlyContinue | Out-Null
                  Write-Host "Auto-Backup completed! All files and Roblox settings secured in Cloud." -ForegroundColor Green
                }
              }
            } catch {
              Write-Host "Backup notice: $_"
            }
          }

          # 20 Minutes before 6-hour limit: Trigger Next Runner (Chaining / Never-ending PC)
          if ($elapsed -ge 20400 -and -not $chainTriggered) { # 5h 40m
            $chainTriggered = $true
            Write-Host "SESSION CHAINING: 20 minutes remaining! Performing final pre-handover state flush..." -ForegroundColor Yellow
            try {
              # Emergency pre-handover flush
              $flushPaths = @()
              foreach ($cp in @("C:\Users\M11 Dev-Tool\Desktop", "C:\Users\M11 Dev-Tool\Documents", "C:\Users\M11 Dev-Tool\Downloads", "C:\Users\M11 Dev-Tool\AppData\Local\Roblox\ClientSettings")) {
                if (Test-Path $cp) { $flushPaths += $cp }
              }
              if ($flushPaths.Count -gt 0) {
                Compress-Archive -Path $flushPaths -DestinationPath "cloud_state.zip" -Force -ErrorAction SilentlyContinue
                $bytes = [System.IO.File]::ReadAllBytes("cloud_state.zip")
                $b64 = [System.Convert]::ToBase64String($bytes)
                $checkUrl = "https://api.github.com/repos/$repo/contents/cloud_state.zip"
                $headers = @{ "Authorization" = "Bearer $token"; "User-Agent" = "M11-Flush-v111" }
                $sha = $null
                try {
                  $rf = Invoke-RestMethod -Uri $checkUrl -Headers $headers -ErrorAction SilentlyContinue
                  if ($rf -and $rf.sha) { $sha = $rf.sha }
                } catch {}
                $bData = @{ message = "M11 Pre-Chaining Emergency Flush"; content = $b64 }
                if ($sha) { $bData["sha"] = $sha }
                Invoke-RestMethod -Uri $checkUrl -Headers $headers -Method Put -Body ($bData | ConvertTo-Json) -ErrorAction SilentlyContinue | Out-Null
                Write-Host "Final state flush completed before handover!" -ForegroundColor Green
              }
            } catch {}

            Write-Host "Dispatching next Cloud PC runner to keep session alive 24/7..." -ForegroundColor Yellow
            try {
              $dispatchUrl = "https://api.github.com/repos/$repo/actions/workflows/m11_cloud_pc.yml/dispatches"
              $dispatchBody = @{
                ref = "main"
                inputs = @{
                  tunnel_provider = "${{ github.event.inputs.tunnel_provider }}"
                  tunnel_token = "${{ github.event.inputs.tunnel_token }}"
                  enable_persistence = "true"
                  pat_token = $token
                }
              } | ConvertTo-Json
              $headers = @{ "Authorization" = "Bearer $token"; "User-Agent" = "M11-Chaining-v011" }
              Invoke-RestMethod -Uri $dispatchUrl -Headers $headers -Method Post -Body $dispatchBody -ErrorAction SilentlyContinue | Out-Null
              Write-Host "Next runner dispatched! Seamless 24/7 handover initiated." -ForegroundColor Green
            } catch {
              Write-Host "Chaining notice: $_"
            }
          }

          if ($elapsed % 120 -eq 0) {
            $mins = [int]($elapsed / 60)
            Write-Host "[ONLINE & HEALTHY] ⚡ Cloud PC is Active: $mins / 360 minutes elapsed (60 FPS Stream Healthy - Ready to connect!)." -ForegroundColor Green
          }
        }
