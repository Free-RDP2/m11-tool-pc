    - name: 8. Session Watchdog & Dual-Guard 24/7 Chaining Daemon
      run: |
        echo "==========================================================================="
        echo "⚡ M11 TOOL - LINUX PC SESSION WATCHDOG ACTIVE & RUNNING 100% ⚡"
        echo ">> IMPORTANT: This step keeps the Linux Workstation alive for up to 6 hours."
        echo ">> DO NOT wait for this step to complete with a green checkmark!"
        echo ">> If this step finishes, the Cloud PC turns off. Spinning icon means ONLINE!"
        echo ">> You can connect via Remote Desktop (XRDP) or Web Browser (NoVNC) now! <<"
        echo "==========================================================================="
        echo "Lead Developer: M11 Dev - Mohamed | v1.11 Linux Enterprise Edition"

        TOKEN="${{ github.event.inputs.pat_token }}"
        if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
        REPO="${{ github.repository }}"
        MAX_SECONDS=21600
        ELAPSED=0
        BACKUP_INTERVAL=300
        LAST_BACKUP=0
        CHAIN_TRIGGERED=false

        while [ "$ELAPSED" -lt "$MAX_SECONDS" ]; do
          sleep 60
          ELAPSED=$((ELAPSED + 60))

          # Periodic Auto-Backup to Cloud (Every 5 Minutes Continuous Sync)
          if [ $((ELAPSED - LAST_BACKUP)) -ge "$BACKUP_INTERVAL" ]; then
            LAST_BACKUP=$ELAPSED
            echo "Continuous State Sync: Preserving user files to Cloud..."
            if [ -d "/home/m11dev/Desktop" ] || [ -d "/home/m11dev/Documents" ]; then
              sudo tar -czf /tmp/cloud_state.tar.gz -C /home/m11dev Desktop Documents Downloads .config/Roblox 2>/dev/null || true
              if [ -s /tmp/cloud_state.tar.gz ]; then
                B64=$(base64 -w 0 /tmp/cloud_state.tar.gz)
                CHECK_URL="https://api.github.com/repos/$REPO/contents/cloud_state.tar.gz"
                SHA=$(curl -s -H "Authorization: Bearer $TOKEN" "$CHECK_URL" | jq -r '.sha // empty')

                if [ -n "$SHA" ]; then
                  BODY=$(jq -n --arg msg "M11 Tool - Linux PC Auto-Backup at ${ELAPSED}s" --arg content "$B64" --arg sha "$SHA" '{message: $msg, content: $content, sha: $sha}')
                else
                  BODY=$(jq -n --arg msg "M11 Tool - Linux PC Auto-Backup at ${ELAPSED}s" --arg content "$B64" '{message: $msg, content: $content}')
                fi

                curl -s -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY" "$CHECK_URL" >/dev/null 2>&1 || true
                echo "Auto-Backup completed! All files and configs secured in Cloud."
              fi
            fi
          fi

          # 20 Minutes before 6-hour limit: Trigger Next Runner (Chaining / Never-ending PC)
          if [ "$ELAPSED" -ge 20400 ] && [ "$CHAIN_TRIGGERED" = "false" ]; then
            CHAIN_TRIGGERED=true
            echo "SESSION CHAINING: 20 minutes remaining! Dispatching next Cloud PC runner..."
            sudo tar -czf /tmp/cloud_state.tar.gz -C /home/m11dev Desktop Documents Downloads 2>/dev/null || true
            B64=$(base64 -w 0 /tmp/cloud_state.tar.gz)
            CHECK_URL="https://api.github.com/repos/$REPO/contents/cloud_state.tar.gz"
            SHA=$(curl -s -H "Authorization: Bearer $TOKEN" "$CHECK_URL" | jq -r '.sha // empty')
            BODY=$(jq -n --arg msg "M11 Pre-Chaining Emergency Flush" --arg content "$B64" --arg sha "$SHA" '{message: $msg, content: $content, sha: $sha}')
            curl -s -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY" "$CHECK_URL" >/dev/null 2>&1 || true

            DISPATCH_URL="https://api.github.com/repos/$REPO/actions/workflows/m11_cloud_linux.yml/dispatches"
            DISPATCH_BODY=$(jq -n \
              --arg ref "main" \
              --arg prov "${{ github.event.inputs.tunnel_provider }}" \
              --arg tok "${{ github.event.inputs.tunnel_token }}" \
              --arg pat "$TOKEN" \
              '{ref: $ref, inputs: {tunnel_provider: $prov, tunnel_token: $tok, enable_persistence: "true", pat_token: $pat}}')

            curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$DISPATCH_BODY" "$DISPATCH_URL" >/dev/null 2>&1 || true
            echo "Next runner dispatched! Seamless 24/7 handover initiated."
          fi

          if [ $((ELAPSED % 120)) -eq 0 ]; then
            MINS=$((ELAPSED / 60))
            echo "[ONLINE & HEALTHY] ⚡ Linux Cloud PC is Active: $MINS / 360 minutes elapsed (60 FPS Mesa3D Stream Healthy)."
          fi
        done
