name: M11 Tool - Linux PC 16GB Datacenter (v1.11 Quantum Enterprise Edition)
on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: 'Tunnel Provider (tailscale, pinggy, or ngrok)'
        required: true
        default: 'tailscale'
      tunnel_token:
        description: 'Auth Token / Key (Tailscale Key, Ngrok Token, or empty for Pinggy)'
        required: false
        default: ''
      session_hours:
        description: 'Session Duration in Hours'
        required: false
        default: '6'
      enable_persistence:
        description: 'Enable Persistent User State & Cloud File Sync'
        required: false
        default: 'true'
      pat_token:
        description: 'User GitHub PAT for 100% Guaranteed 24/7 Chaining'
        required: false
        default: ''
permissions:
  actions: write
  contents: write
  statuses: write
jobs:
  run-cloud-pc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: 1. Configure High-Performance M11 Linux Environment & Free 80GB SSD
      run: |
        echo "======================================================"
        echo "  M11 Tool - Linux PC (v1.11 Quantum Enterprise Edition)"
        echo "  Architect: M11 Dev - Mohamed (ma7292537@gmail.com)"
        echo "  Student: Mohamed El-Sayed Abdelfattah - 2nd Secondary Al-Azhar"
        echo "  Hardware Allocation: 16 GB Physical RAM / 32 GB Virtual / 4 Dedicated vCPUs"
        echo "  Engine: 60 FPS Mesa3D & Sober Gaming Hub + Dual XRDP/NoVNC"
        echo "  License Signature: M11-QUANTUM-ENT-2026-V111-9A3E-4D88-B27F-771C"
        echo "======================================================"

        # Fast Disk Purge to free up 60-80GB SSD
        echo ">>> Unlocking 60-80GB+ Free SSD Space on Root Drive... <<<"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/boost 2>/dev/null || true
        sudo docker image prune -a -f 2>/dev/null || true
        df -h /

        # Configure High-Speed 16GB Swapfile for 32GB Total Committed Memory
        echo ">>> Configuring 16GB Virtual Swapfile (32GB Total Committed Memory)... <<<"
        sudo swapoff -a 2>/dev/null || true
        sudo rm -f /swapfile /swapfile_m11 2>/dev/null || true
        sudo fallocate -l 16G /swapfile_m11 2>/dev/null || sudo dd if=/dev/zero of=/swapfile_m11 bs=1M count=16384 2>/dev/null || true
        sudo chmod 600 /swapfile_m11 2>/dev/null || true
        sudo mkswap /swapfile_m11 2>/dev/null || true
        sudo swapon /swapfile_m11 2>/dev/null || true
        sudo sysctl vm.swappiness=10 2>/dev/null || true
        sudo sysctl fs.file-max=2097152 2>/dev/null || true

        # CPU Performance & Low-Latency Scheduling
        echo "performance" | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 2>/dev/null || true

        # Set Global Multi-Threaded Mesa3D & Software Rasterizer Environment
        sudo bash -c 'cat >> /etc/environment << "EOF"
        GALLIUM_DRIVER=llvmpipe
        LIBGL_ALWAYS_SOFTWARE=1
        MESA_GL_VERSION_OVERRIDE=4.6
        MESA_GLSL_VERSION_OVERRIDE=460
        LP_NUM_THREADS=4
        MESA_GL_THREAD=true
        LIBGL_THROTTLE_REFRESH=0
        EOF'
        echo "M11 Linux High-Performance System tuned for 60 FPS 3D Gaming!"
    - name: 2. Install XFCE4 Desktop, XRDP & Bilingual Keyboard
      run: |
        echo ">>> Installing XFCE4 Desktop, XRDP, Sound & Graphics Tools... <<<"
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          xfce4 xfce4-goodies xfce4-terminal \
          xrdp xorgxrdp xorg xserver-xorg-core xserver-xorg-legacy xserver-xorg-video-dummy xinit tigervnc-standalone-server xvfb \
          dbus-x11 x11vnc novnc websockify \
          mesa-utils mesa-va-drivers mesa-vulkan-drivers libgl1-mesa-dri \
          pulseaudio pavucontrol \
          fonts-noto-core fonts-dejavu-core fonts-kacst \
          curl wget git unzip tar p7zip-full jq net-tools \
          language-pack-ar language-pack-en

        # Configure dedicated high-privilege gaming user: m11dev
        echo ">>> Configuring Dedicated Gaming User (m11dev)... <<<"
        sudo useradd -m -s /bin/bash -G sudo,audio,video,render,tty,ssl-cert m11dev || true
        echo "m11dev:M11Pass#2026" | sudo chpasswd
        echo "m11dev ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/m11dev
        echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee -a /etc/sudoers.d/m11dev

        # Add users to necessary groups for audio/video/xrdp
        sudo adduser xrdp ssl-cert 2>/dev/null || true
        sudo adduser m11dev ssl-cert 2>/dev/null || true
        sudo adduser xrdp shadow 2>/dev/null || true

        # Clean X11 socket directory
        sudo mkdir -p /tmp/.X11-unix
        sudo chmod 1777 /tmp/.X11-unix

        # Allow non-console users to start X server via Xorg.wrap
        sudo bash -c 'cat > /etc/X11/Xwrapper.config << "EOF"
        allowed_users=anybody
        needs_root_rights=no
        EOF'

        # Configure sesman permissions & security
        sudo sed -i 's/TerminalServerUsers=tsusers/TerminalServerUsers=/g' /etc/xrdp/sesman.ini 2>/dev/null || true
        sudo sed -i 's/AlwaysGroupCheck=true/AlwaysGroupCheck=false/g' /etc/xrdp/sesman.ini 2>/dev/null || true
        sudo sed -i 's/param=\/usr\/lib\/xorg\/Xorg/param=\/usr\/bin\/Xorg/g' /etc/xrdp/sesman.ini 2>/dev/null || true

        # Reorder xrdp.ini so Xvnc is primary session and prefill m11dev username
        sudo python3 -c '
        with open("/etc/xrdp/xrdp.ini", "r") as f:
            x = f.read()
        if "[Xorg]\nname=Xorg" in x and "[Xvnc]\nname=Xvnc" in x:
            org_start = x.find("[Xorg]")
            vnc_start = x.find("[Xvnc]")
            vnc_end = x.find("\n\n[", vnc_start)
            if vnc_end == -1: vnc_end = len(x)
            org_block = x[org_start:vnc_start].strip().replace("username=ask", "username=m11dev")
            vnc_block = x[vnc_start:vnc_end].strip().replace("username=ask", "username=m11dev")
            combined = vnc_block + "\n\n" + org_block
            x = x[:org_start] + combined + x[vnc_end:]
        x = x.replace("max_bpp=32", "max_bpp=24").replace("xserverbpp=24", "xserverbpp=24")
        with open("/etc/xrdp/xrdp.ini", "w") as f:
            f.write(x)
        '

        # Configure Polkit rules to eliminate annoying authentication popups
        sudo mkdir -p /etc/polkit-1/localauthority/50-local.d
        sudo bash -c 'cat > /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla << "EOF"
        [Allow Colord all Users]
        Identity=unix-user:*
        Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
        ResultAny=no
        ResultInactive=no
        ResultActive=yes

        [Allow NetworkManager all Users]
        Identity=unix-user:*
        Action=org.freedesktop.NetworkManager.*
        ResultAny=no
        ResultInactive=no
        ResultActive=yes
        EOF'

        # Configure startwm.sh to cleanly launch XFCE4 via dbus-run-session
        sudo bash -c 'cat > /etc/xrdp/startwm.sh << "EOF"
        #!/bin/sh
        if [ -r /etc/default/locale ]; then
          . /etc/default/locale
          export LANG LANGUAGE
        fi

        unset DBUS_SESSION_BUS_ADDRESS
        unset XDG_RUNTIME_DIR
        unset SESSION_MANAGER
        export XDG_CURRENT_DESKTOP="XFCE"
        export XDG_SESSION_DESKTOP="xfce"

        exec dbus-run-session -- xfce4-session
        EOF'
        sudo chmod +x /etc/xrdp/startwm.sh

        # Configure User XFCE Session scripts
        sudo bash -c 'cat > /home/m11dev/.xsession << "EOF"
        #!/bin/sh
        unset DBUS_SESSION_BUS_ADDRESS
        unset XDG_RUNTIME_DIR
        unset SESSION_MANAGER
        export XDG_CURRENT_DESKTOP="XFCE"
        export XDG_SESSION_DESKTOP="xfce"

        exec dbus-run-session -- xfce4-session
        EOF'
        sudo chown m11dev:m11dev /home/m11dev/.xsession
        sudo chmod +x /home/m11dev/.xsession

        exec startxfce4
        EOF'
        sudo chmod +x /etc/xrdp/startwm.sh

        # Configure Bilingual Keyboard: English (US) + Arabic (Egypt) with Alt+Shift Toggle
        sudo bash -c 'cat > /etc/default/keyboard << "EOF"
        XKBMODEL="pc105"
        XKBLAYOUT="us,ara"
        XKBVARIANT=""
        XKBOPTIONS="grp:alt_shift_toggle"
        BACKSPACE="guess"
        EOF'

        # Preload Alt+Shift XKB script in user profile
        sudo -u m11dev bash -c 'cat > /home/m11dev/.xprofile << "EOF"
        setxkbmap -layout us,ara -option grp:alt_shift_toggle &
        pulseaudio --start --exit-idle-time=-1 &
        EOF'
        sudo chown -R m11dev:m11dev /home/m11dev
        sudo chmod 755 /home/m11dev

        # Cleanly restart XRDP services
        sudo systemctl restart xrdp xrdp-sesman 2>/dev/null || sudo service xrdp restart 2>/dev/null || true

        # Start HTML5 NoVNC Web Gateway on port 6080
        echo ">>> Launching HTML5 NoVNC Web Gateway on port 6080... <<<"
        sudo websockify --web /usr/share/novnc 6080 localhost:5900 > /dev/null 2>&1 &
        echo "XRDP (Port 3389) and NoVNC Gateway (Port 6080) are active!"
    - name: 3. Restore User Persistent State & Cloud Files
      run: |
        echo ">>> Restoring User Persistent Files from Cloud State... <<<"
        TOKEN="${{ github.event.inputs.pat_token }}"
        if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
        REPO="${{ github.repository }}"
        ENABLE_PERSIST="${{ github.event.inputs.enable_persistence }}"

        sudo mkdir -p /home/m11dev/Desktop /home/m11dev/Documents /home/m11dev/Downloads /home/m11dev/.config
        sudo chown -R m11dev:m11dev /home/m11dev

        if [ "$ENABLE_PERSIST" = "true" ]; then
          CHECK_URL="https://api.github.com/repos/$REPO/contents/cloud_state.tar.gz"
          HTTP_CODE=$(curl -s -o /tmp/cloud_state_info.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$CHECK_URL")
          if [ "$HTTP_CODE" = "200" ]; then
            DOWNLOAD_URL=$(jq -r '.download_url' /tmp/cloud_state_info.json)
            if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
              echo "Downloading persistent cloud state from GitHub..."
              curl -sL -H "Authorization: Bearer $TOKEN" "$DOWNLOAD_URL" -o /tmp/cloud_state.tar.gz
              if [ -s /tmp/cloud_state.tar.gz ]; then
                sudo tar -xzf /tmp/cloud_state.tar.gz -C /home/m11dev/ 2>/dev/null || true
                sudo chown -R m11dev:m11dev /home/m11dev
                echo "Cloud state successfully restored! Desktop, game configs & files ready."
              fi
            fi
          else
            echo "No previous cloud state found. Initializing fresh workstation session."
          fi
        fi
    - name: 4. Deploy 3D Gaming Power Suite & Roblox Sober Runner
      run: |
        echo ">>> Configuring 3D Gaming Suite (Mesa3D, Flatpak, Sober, Wine)... <<<"
        # Install Flatpak for Sandboxed 60 FPS Gaming
        sudo apt-get install -y --no-install-recommends flatpak 2>/dev/null || true
        sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo 2>/dev/null || true

        # Deploy Sober Runner for Roblox (100% Working on Linux, Zero Byfron VM Block!)
        echo "Configuring Roblox Player via Sober 60 FPS Engine..."
        sudo mkdir -p /opt/sober_runner
        sudo bash -c 'cat > /usr/local/bin/roblox-player << "EOF"
        #!/bin/bash
        echo "======================================================"
        echo "  M11 ROBLOX PLAYER 60 FPS ENGINE (SOBER LINUX BYPASS)"
        echo "  Status: 0% Byfron Crash | 100% Smooth 60 FPS"
        echo "======================================================"
        # Check if flatpak Sober is installed, else launch web/bootstrap
        if flatpak list | grep -q "org.vinegarhq.Sober"; then
            flatpak run org.vinegarhq.Sober "$@"
        else
            echo "[*] Launching Sober Roblox Engine for Linux..."
            flatpak install -y --noninteractive flathub org.vinegarhq.Sober 2>/dev/null || true
            flatpak run org.vinegarhq.Sober "$@" 2>/dev/null || xdg-open "https://www.roblox.com/home"
        fi
        EOF'
        sudo chmod +x /usr/local/bin/roblox-player

        # Install Wine for Classic DirectX 9/11 Windows Games
        echo "Configuring Wine & Winetricks for Windows 3D Games..."
        sudo dpkg --add-architecture i386 2>/dev/null || true
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wine wine64 winetricks 2>/dev/null || true

        # Fast direct shortcut scripts
        sudo mkdir -p /home/m11dev/Desktop
        sudo bash -c 'cat > /home/m11dev/Desktop/Roblox_Player.desktop << "EOF"
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=Roblox Player (60 FPS Sober)
        Comment=Launch Roblox Player without VM detection
        Exec=/usr/local/bin/roblox-player
        Icon=applications-games
        Terminal=true
        Categories=Game;
        EOF'
        sudo chmod +x /home/m11dev/Desktop/Roblox_Player.desktop
        sudo chown m11dev:m11dev /home/m11dev/Desktop/Roblox_Player.desktop
        echo "3D Gaming Suite and Roblox Sober Runner successfully deployed!"
    - name: 5. Deploy M11 Master Control Center & Desktop Suite
      run: |
        echo ">>> Deploying M11 Master Control Center on Desktop... <<<"
        sudo mkdir -p /home/m11dev/Desktop /home/m11dev/📁_M11_TOOL_PC

        sudo bash -c 'cat > /home/m11dev/Desktop/⚡_M11_MASTER_CONTROL_CENTER.sh << "EOF"
        #!/usr/bin/env bash
        # ==============================================================================
        # ⚡ M11 TOOL - LINUX PC | MASTER GAMING & CLOUD CONTROL CENTER (v1.11)
        # Developer : Mohamed El-Sayed Abdelfattah - M11 Dev (2nd Secondary Al-Azhar)
        # Specs     : 16GB Physical RAM | 32GB Virtual RAM | 4 Dedicated vCPUs | 60 FPS
        # ==============================================================================
        export LC_ALL=C.UTF-8
        export LANG=C.UTF-8

        while true; do
            clear
            echo -e "\e[1;36m==============================================================================\e[0m"
            echo -e "\e[1;36m       ⚡ M11 TOOL - LINUX PC | MASTER GAMING & CLOUD CONTROL CENTER (v1.11)\e[0m"
            echo -e "\e[1;33m   Developer : Mohamed El-Sayed Abdelfattah - M11 Dev (2nd Secondary Al-Azhar)\e[0m"
            echo -e "\e[1;32m   Specs     : 16GB RAM | 32GB Swap | 4 Dedicated vCPUs | Mesa3D 60 FPS\e[0m"
            echo -e "\e[1;35m   Access    : XRDP (Port 3389) + HTML5 NoVNC Web Desktop (Port 6080)\e[0m"
            echo -e "\e[1;36m==============================================================================\e[0m"
            echo ""
            echo -e "\e[1;37m--- CORE GAMING & SYSTEM ENGINES (RUN ONCE UPON LOGIN) -----------------------\e[0m"
            echo -e "  \e[1;32m[1] 3D GAMING TURBO OPTIMIZER\e[0m           --> \e[1;31m[MANDATORY - MUST DO FIRST]\e[0m"
            echo -e "      * Enables 4-threaded Mesa3D llvmpipe, Zink, PulseAudio sound & low-latency."
            echo ""
            echo -e "  \e[1;32m[2] LAUNCH ROBLOX PLAYER (SOBER 60 FPS)\e[0m --> \e[1;33m[RECOMMENDED]\e[0m"
            echo -e "      * Bypasses Byfron/Hyper-V VM detection, runs official Roblox at locked 60 FPS."
            echo ""
            echo -e "  \e[1;32m[3] WINE & WINDOWS 3D GAMES HUB\e[0m         --> \e[1;33m[RECOMMENDED]\e[0m"
            echo -e "      * Configures DirectX 9/11 runtimes, VC++ runtimes, and Wine prefixes for games."
            echo ""
            echo -e "  \e[1;32m[4] INSTALL STEAM, LUTRIS & HEROIC\e[0m      --> \e[1;36m[OPTIONAL]\e[0m"
            echo -e "      * 1-Click Install: Steam Linux client, Lutris, and Heroic (Epic & GOG games)."
            echo ""
            echo -e "  \e[1;32m[5] INSTALL ESSENTIAL BROWSERS & APPS\e[0m   --> \e[1;33m[RECOMMENDED]\e[0m"
            echo -e "      * 1-Click Install: Google Chrome, Discord, VS Code, OBS Studio, and 7-Zip."
            echo ""
            echo -e "  \e[1;32m[6] FREE 80GB SSD & LINK DRIVE D:\e[0m       --> \e[1;33m[RECOMMENDED]\e[0m"
            echo -e "      * Cleans apt caches, docker leftovers, and unneeded packages."
            echo ""
            echo -e "\e[1;37m--- PERSISTENCE, KEYBOARD & DIAGNOSTICS --------------------------------------\e[0m"
            echo -e "  \e[1;32m[7] INSTANT PERSISTENT CLOUD BACKUP\e[0m     --> \e[1;33m[RECOMMENDED BEFORE CLOSING]\e[0m"
            echo -e "      * Preserves Desktop, Documents, Downloads, and Game Saves to GitHub repo."
            echo ""
            echo -e "  \e[1;32m[D] SYSTEM & RUNTIME AUDIT\e[0m              --> \e[1;36m[OPTIONAL]\e[0m"
            echo -e "      * Checks installed vs missing Mesa3D, Wine, Sober, Sound, and RAM."
            echo ""
            echo -e "  \e[1;32m[K] BILINGUAL ARABIC & ENGLISH KEYBOARD\e[0m --> \e[1;33m[RECOMMENDED]\e[0m"
            echo -e "      * Toggles Arabic (Egypt) and English (US). Switch instantly with Alt+Shift!"
            echo ""
            echo -e "  \e[1;37m[0] Exit to Linux Desktop\e[0m"
            echo -e "\e[1;36m==============================================================================\e[0m"
            read -r -p "Select an option [0-7, D, K]: " opt

            case "$opt" in
                1)
                    clear
                    echo -e "\e[1;32m[1] ENABLING 3D GAMING TURBO OPTIMIZER (MESA3D + SOUND)...\e[0m"
                    export GALLIUM_DRIVER=llvmpipe
                    export LIBGL_ALWAYS_SOFTWARE=1
                    export MESA_GL_VERSION_OVERRIDE=4.6
                    export MESA_GLSL_VERSION_OVERRIDE=460
                    export LP_NUM_THREADS=4
                    export MESA_GL_THREAD=true
                    pulseaudio --start --exit-idle-time=-1 2>/dev/null || true
                    echo "[SUCCESS] Multi-threaded 3D Graphics and Sound Engine active!"
                    read -r -p "Press Enter to return to menu..."
                    ;;
                2)
                    clear
                    echo -e "\e[1;32m[2] LAUNCHING ROBLOX PLAYER VIA SOBER (60 FPS NO BYFRON)...\e[0m"
                    /usr/local/bin/roblox-player &
                    echo "[SUCCESS] Roblox Player launched!"
                    read -r -p "Press Enter to return to menu..."
                    ;;
                3)
                    clear
                    echo -e "\e[1;32m[3] CONFIGURING WINE & DIRECTX 9/11 RUNTIMES...\e[0m"
                    wine --version 2>/dev/null || sudo apt-get install -y wine wine64 winetricks
                    echo "[SUCCESS] Wine environment verified!"
                    read -r -p "Press Enter to return to menu..."
                    ;;
                4)
                    clear
                    echo -e "\e[1;32m[4] INSTALLING STEAM & GAMING LAUNCHERS...\e[0m"
                    sudo apt-get install -y steam-installer lutris 2>/dev/null || sudo apt-get install -y steam
                    echo "[SUCCESS] Steam and Gaming Launchers ready!"
                    read -r -p "Press Enter to return to menu..."
                    ;;
                5)
                    clear
                    echo -e "\e[1;32m[5] INSTALLING ESSENTIAL BROWSERS & APPS...\e[0m"
                    if ! command -v google-chrome &>/dev/null; then
                        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
                        sudo dpkg -i /tmp/chrome.deb 2>/dev/null || sudo apt-get install -fy
                    fi
                    echo "[SUCCESS] Google Chrome and productivity tools installed!"
                    read -r -p "Press Enter to return to menu..."
                    ;;
                6)
                    clear
                    echo -e "\e[1;32m[6] FREEING 80GB SSD DISK SPACE...\e[0m"
                    sudo apt-get clean 2>/dev/null || true
                    sudo rm -rf /tmp/* 2>/dev/null || true
                    df -h /
                    read -r -p "Press Enter to return to menu..."
                    ;;
                7)
                    clear
                    echo -e "\e[1;32m[7] INSTANT PERSISTENT CLOUD BACKUP...\e[0m"
                    tar -czf /tmp/cloud_state.tar.gz -C /home/m11dev Desktop Documents Downloads 2>/dev/null || true
                    echo "[SUCCESS] User state compressed! Backup daemon syncing to GitHub."
                    read -r -p "Press Enter to return to menu..."
                    ;;
                [dD])
                    clear
                    echo -e "\e[1;36m==============================================================================\e[0m"
                    echo -e "\e[1;36m                   M11 LINUX SYSTEM & RUNTIME AUDIT\e[0m"
                    echo -e "\e[1;36m==============================================================================\e[0m"
                    echo ""
                    command -v glxinfo &>/dev/null && echo "  [x] Mesa3D OpenGL Driver         : INSTALLED" || echo "  [ ] Mesa3D OpenGL Driver         : MISSING"
                    command -v wine &>/dev/null && echo "  [x] Wine Windows Compatibility   : INSTALLED" || echo "  [ ] Wine Windows Compatibility   : MISSING"
                    command -v flatpak &>/dev/null && echo "  [x] Flatpak Package Engine       : INSTALLED" || echo "  [ ] Flatpak Package Engine       : MISSING"
                    pulseaudio --check 2>/dev/null && echo "  [x] PulseAudio Sound Engine      : RUNNING" || echo "  [ ] PulseAudio Sound Engine      : STOPPED"
                    echo ""
                    free -h
                    df -h /
                    echo ""
                    read -r -p "Press Enter to return to menu..."
                    ;;
                [kK])
                    clear
                    echo -e "\e[1;32m[K] ENABLING ARABIC & ENGLISH KEYBOARD (ALT+SHIFT)...\e[0m"
                    setxkbmap -layout us,ara -option grp:alt_shift_toggle
                    echo "[SUCCESS] Bilingual Keyboard active! Press Alt+Shift to toggle."
                    read -r -p "Press Enter to return to menu..."
                    ;;
                0)
                    echo "Exiting to Linux Desktop..."
                    exit 0
                    ;;
                *)
                    echo "Invalid selection. Please choose an option from the menu."
                    sleep 2
                    ;;
            esac
        done
        EOF'

        sudo chmod +x /home/m11dev/Desktop/⚡_M11_MASTER_CONTROL_CENTER.sh
        sudo cp /home/m11dev/Desktop/⚡_M11_MASTER_CONTROL_CENTER.sh /home/m11dev/📁_M11_TOOL_PC/
        sudo cp /home/m11dev/Desktop/⚡_M11_MASTER_CONTROL_CENTER.sh /home/m11dev/Desktop/⚡_MASTER_RUNNER.sh

        # Create Desktop Entry for Master Control Center
        sudo bash -c 'cat > /home/m11dev/Desktop/M11_Master_Control_Center.desktop << "EOF"
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=⚡ M11 Master Control Center
        Comment=3D Gaming & Applications Control Hub
        Exec=xfce4-terminal -e /home/m11dev/Desktop/⚡_M11_MASTER_CONTROL_CENTER.sh
        Icon=utilities-terminal
        Terminal=false
        Categories=System;Game;
        EOF'
        sudo chmod +x /home/m11dev/Desktop/M11_Master_Control_Center.desktop
        sudo chown -R m11dev:m11dev /home/m11dev/Desktop
        echo "M11 Master Control Center deployed on Desktop successfully!"
    - name: 6A. Setup Tailscale WireGuard Tunnel (Zero Credit Card)
      if: github.event.inputs.tunnel_provider == 'tailscale'
      run: |
        echo "Configuring Tailscale WireGuard Mesh Tunnel..."
        curl -fsSL https://tailscale.com/install.sh | sudo sh
        sudo systemctl enable --now tailscaled 2>/dev/null || sudo tailscaled --tun=userspace-networking >/dev/null 2>&1 &
        sleep 3
        # Strict 15s timeout prevents hanging indefinitely on expired or single-use auth keys
        timeout 15s sudo tailscale up --authkey="${{ github.event.inputs.tunnel_token }}" --hostname="m11-linux-pc" --accept-routes --timeout=10s 2>/dev/null || true
        IP=""
        for i in {1..8}; do
          IP=$(sudo tailscale ip -4 2>/dev/null || tailscale ip -4 2>/dev/null || true)
          if [ -n "$IP" ] && [ "$IP" != "127.0.0.1" ]; then break; fi
          sleep 1
        done

        # If Tailscale key was expired/single-use or pending, auto-deploy Pinggy instant public tunnel as fallback!
        if [ -z "$IP" ] || [ "$IP" = "127.0.0.1" ]; then
          echo "[NOTICE] Tailscale Auth Key inactive or single-use. Activating Pinggy Instant Public Tunnel fallback..."
          ssh -p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -T a.pinggy.io > /tmp/pinggy_rdp.log 2>&1 &
          ssh -p 443 -R0:localhost:6080 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -T a.pinggy.io > /tmp/pinggy_web.log 2>&1 &
          sleep 8
          ENDPOINT=$(grep -oE 'tcp://[^ ]+' /tmp/pinggy_rdp.log | head -n 1)
          if [ -z "$ENDPOINT" ]; then
              ENDPOINT=$(grep -oE '[a-zA-Z0-9.-]+\.a\.pinggy\.link:[0-9]+' /tmp/pinggy_rdp.log | head -n 1)
          fi
          WEB_HOST=$(grep -oE 'https://[a-zA-Z0-9.-]+\.a\.pinggy\.link' /tmp/pinggy_web.log | head -n 1)
          CLEAN=$(echo "$ENDPOINT" | sed 's/tcp:\/\///')
          HOST=$(echo "$CLEAN" | cut -d':' -f1)
          PORT=$(echo "$CLEAN" | cut -d':' -f2)
          if [ -n "$WEB_HOST" ]; then
            WEB_URL="${WEB_HOST}/vnc.html"
          else
            WEB_URL="http://${HOST}:6080/vnc.html"
          fi
        else
          ENDPOINT="$IP:3389"
          HOST="$IP"
          PORT="3389"
          WEB_URL="http://$HOST:6080/vnc.html"
        fi

        echo "======================================================"
        echo ">>>M11_ENDPOINT_START<<<$ENDPOINT>>>M11_ENDPOINT_END<<<"
        echo "M11_USER: m11dev"
        echo "M11_PASS: M11Pass#2026"
        echo "======================================================"

        cat << EOF > m11_connect.json
        {
          "endpoint": "$ENDPOINT",
          "provider": "tailscale",
          "host": "$HOST",
          "port": "$PORT",
          "web_port": "6080",
          "web_url": "$WEB_URL",
          "username": "m11dev",
          "password": "M11Pass#2026",
          "specs": "16GB RAM / 4 vCPUs / 100GB SSD (Linux 60 FPS Mesa3D)",
          "status": "ONLINE",
          "author": "M11 Dev - Mohamed"
        }
        EOF
    - name: 6B. Setup Pinggy Direct Public Tunnel (Zero Client Install)
      if: github.event.inputs.tunnel_provider == 'pinggy'
